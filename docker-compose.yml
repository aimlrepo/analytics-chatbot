services:
  postgres:
    image: postgres:16-alpine
    container_name: l2l_postgres_db
    environment:
      POSTGRES_DB: l2l_chat_memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d l2l_chat_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

  typedb:
    #image: vaticle/typedb:2.28.2  
    image: vaticle/typedb:2.29.0
    container_name: l2l_typedb
    ports:
      - "1729:1729"
    volumes:
      - typedb_data:/opt/typedb-all-linux-x86_64/server/data

  web:
    build: .
    container_name: l2l_analytics_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - POSTGRES_URL=postgresql://postgres:postgrespassword@postgres:5432/l2l_chat_memory
      - TYPEDB_HOST=typedb
      - TYPEDB_PORT=1729
      - TYPEDB_DATABASE=l2l_analytics
    volumes:
      - .:/app
      - ./data:/mnt/duckdb
      - ${GCLOUD_CONFIG_DIR:-./gcloud}:/root/.config/gcloud:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  typedb_data:
