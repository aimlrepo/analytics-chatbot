<aside 
    id="sidebar-container" 
    hx-get="/sidebar" 
    hx-trigger="refreshSidebar from:body" 
    hx-target="this" 
    hx-swap="outerHTML" 
    hx-include="#active-thread-id-input"
    class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col h-full flex-shrink-0">
    
    <!-- Header / Branding & New Chat Button -->
    <div class="p-4 border-b border-gray-800">
        <h1 class="text-xl font-bold text-blue-400 mb-4 flex items-center gap-2">
            📊 L2L Analytics
        </h1>
        <button 
            hx-post="/chat/new" 
            hx-target="#chat-workspace" 
            hx-swap="innerHTML" 
            class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-500 transition-colors flex items-center justify-center gap-2 font-medium text-sm shadow">
            <span>+</span> New Chat
        </button>
    </div>

    <!-- Recent Threads Section -->
    <div class="p-3 space-y-1 overflow-y-auto flex-1">
        <div class="px-2 py-1 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
            Recent Threads
        </div>

        {% for thread in threads %}
        <a 
            href="#" 
            hx-get="/chat/history/{{ thread.thread_id }}" 
            hx-target="#chat-workspace" 
            hx-swap="innerHTML"
            class="group flex items-center gap-2 px-3 py-2 text-xs font-mono rounded-md transition-colors truncate {% if thread.thread_id == active_thread_id %}bg-gray-800 text-blue-400 font-semibold border-l-2 border-blue-500{% else %}text-gray-300 hover:bg-gray-800 hover:text-white{% endif %}"
            title="{{ thread.thread_id }}">
            <span class="text-gray-400 group-hover:text-gray-200">🕒</span>
            <span class="truncate">{{ thread.thread_id }}</span>
        </a>
        {% else %}
        <div class="px-3 py-2 text-xs text-gray-500 italic">No recent threads</div>
        {% endfor %}
    </div>
</aside>
