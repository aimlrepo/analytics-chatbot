<!-- User Question Bubble -->
<div class="flex justify-end mb-4">
    <div class="bg-blue-600 text-white px-4 py-2 rounded-lg max-w-xl text-sm shadow">
        {{ user_message }}
    </div>
</div>

<!-- Bot Response Bubble -->
<div class="flex justify-start mb-4 w-full">
    <div class="bg-gray-800 border border-gray-700 text-gray-100 px-4 py-3 rounded-lg max-w-3xl text-sm shadow w-full">
        <!-- Render Bot Text -->
        {% if bot_response %}
        <div class="bot-text-content space-y-2 prose prose-invert max-w-none">
            <textarea class="raw-markdown" style="display:none;">{{ bot_response }}</textarea>
            <div class="rendered-markdown"></div>
        </div>
        {% endif %}

        <!-- Render Stacked Plotly Charts -->
        {% if plotly_jsons and plotly_jsons|length > 0 %}
            <div class="mt-4 space-y-4">
            {% for chart_json in plotly_jsons %}
                <div class="w-full bg-gray-900 rounded border border-gray-700 p-2" style="min-height: 350px;"></div>
                <script>
                    (function() {
                        try {
                            const figure = {{ chart_json | safe }};
                            const container = document.currentScript.previousElementSibling;
                            if (container && figure) {
                                Plotly.newPlot(container, figure.data, figure.layout, { responsive: true });
                            }
                        } catch (e) {
                            console.error("Error rendering Plotly chart:", e);
                        }
                    })();
                </script>
            {% endfor %}
            </div>
        {% elif plotly_json %}
            <div class="mt-4 w-full bg-gray-900 rounded border border-gray-700 p-2" style="min-height: 350px;"></div>
            <script>
                (function() {
                    try {
                        const figure = {{ plotly_json | safe }};
                        const container = document.currentScript.previousElementSibling;
                        if (container && figure) {
                            Plotly.newPlot(container, figure.data, figure.layout, { responsive: true });
                        }
                    } catch (e) {
                        console.error("Error rendering Plotly chart:", e);
                    }
                })();
            </script>
        {% endif %}
    </div>
</div>

<script>
    (function() {
        if (typeof renderMarkdownBubbles === 'function') {
            renderMarkdownBubbles();
        } else if (window.marked) {
            const containers = document.querySelectorAll('.bot-text-content');
            const latest = containers[containers.length - 1];
            if (latest) {
                const rawEl = latest.querySelector('.raw-markdown');
                const targetEl = latest.querySelector('.rendered-markdown');
                if (rawEl && targetEl) {
                    targetEl.innerHTML = marked.parse(rawEl.value || '');
                }
            }
        }
    })();
</script>

{% if active_thread_id %}
<input type="hidden" name="thread_id" value="{{ active_thread_id }}" id="active-thread-id-input" hx-swap-oob="outerHTML" />
<span id="chat-header-title" class="font-medium text-gray-200 truncate max-w-lg" hx-swap-oob="outerHTML">
    💬 {{ active_thread_id }}
</span>
{% endif %}
